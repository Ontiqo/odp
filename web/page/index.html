<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas, video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #waiting { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             background: #1f2a44; color: #fff; text-align: center; gap: 2vh; padding: 0 8vw; }
  #name { font-size: 6vh; font-weight: 700; }
  #how { font-size: 3vh; }
  #pin { font-size: 12vh; font-weight: 700; letter-spacing: .1em; }
</style>
</head>
<body>
<canvas id="picture"></canvas>
<video id="video" muted playsinline></video>
<div id="waiting">
  <div id="name">Screen</div>
  <div id="how">Connecting…</div>
  <div id="pin"></div>
</div>
<script src="mse.js"></script>
<script src="receiver.js"></script>
</body>
</html>
