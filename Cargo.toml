[package]
name = "odp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Open Display Protocol: pairing, encrypted sessions, clock sync, media and input for screen receivers"
repository = "https://github.com/Ontiqo/odp"
readme = "README.md"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
spake2 = "0.4"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In a browser (the web profile's receivers: LG and Samsung TVs), randomness comes from crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[workspace]
members = [".", "receiver", "conformance", "web"]
